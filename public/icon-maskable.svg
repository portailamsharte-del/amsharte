<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Inner safe zone content scaled within 75% center -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Inner glowing circle -->
    <circle cx="256" cy="230" r="160" fill="#ffffff" fill-opacity="0.08" stroke="#34d399" stroke-width="4" stroke-dasharray="8 6" />

    <!-- ASR Letters -->
    <g transform="translate(76, 120)">
      <text x="30" y="115" font-family="'Times New Roman', serif" font-size="125" font-weight="bold" fill="#34d399">A</text>
      <text x="120" y="115" font-family="'Times New Roman', serif" font-size="125" font-weight="bold" fill="#fb923c">S</text>
      <text x="200" y="115" font-family="'Times New Roman', serif" font-size="125" font-weight="bold" fill="#f87171">R</text>
      <rect x="95" y="72" width="110" height="7" fill="#ffffff" rx="2" />
      <line x1="220" y1="160" x2="300" y2="85" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
      <g stroke="#f87171" stroke-width="3.5" stroke-linecap="round">
        <line x1="305" y1="78" x2="315" y2="60" />
        <line x1="310" y1="83" x2="328" y2="70" />
        <line x1="312" y1="90" x2="332" y2="85" />
        <line x1="310" y1="96" x2="326" y2="105" />
      </g>
    </g>

    <!-- Turtle Silhouette -->
    <g transform="translate(256, 335) scale(0.9)">
      <ellipse cx="0" cy="0" rx="36" ry="44" fill="#10b981" stroke="#ecfdf5" stroke-width="3.5" />
      <circle cx="0" cy="-56" r="16" fill="#10b981" stroke="#ecfdf5" stroke-width="3" />
      <path d="M -30 -25 C -75 -45 -65 10 -35 0" fill="#059669" stroke="#ecfdf5" stroke-width="2.5" />
      <path d="M 30 -25 C 75 -45 65 10 35 0" fill="#059669" stroke="#ecfdf5" stroke-width="2.5" />
      <path d="M -25 35 C -45 55 -30 65 -15 45" fill="#059669" stroke="#ecfdf5" stroke-width="2.5" />
      <path d="M 25 35 C 45 55 30 65 15 45" fill="#059669" stroke="#ecfdf5" stroke-width="2.5" />
      <line x1="0" y1="-44" x2="0" y2="44" stroke="#ecfdf5" stroke-width="2.5" />
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#ecfdf5" stroke-width="2.5" />
    </g>

    <!-- Text -->
    <text x="256" y="445" font-family="'Arial Black', 'Montserrat', 'Inter', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="3" text-anchor="middle">ONG AMSHARTE</text>
    <text x="256" y="475" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#a7f3d0" letter-spacing="2" text-anchor="middle">BÉNIN</text>
  </g>
</svg>
