<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Filter for subtle crispness -->
    <filter id="crisp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Letter A (Green) -->
  <text x="35" y="145" font-family="'Times New Roman', 'Baskerville', 'Playfair Display', serif" font-size="160" font-weight="bold" fill="#38763C" letter-spacing="-2">A</text>

  <!-- Letter S (Orange) -->
  <text x="140" y="145" font-family="'Times New Roman', 'Baskerville', 'Playfair Display', serif" font-size="160" font-weight="bold" fill="#EB8333" letter-spacing="-2">S</text>

  <!-- Letter R (Red) -->
  <text x="235" y="145" font-family="'Times New Roman', 'Baskerville', 'Playfair Display', serif" font-size="160" font-weight="bold" fill="#DE3426" letter-spacing="-2">R</text>

  <!-- Solid Horizontal Crossbar traversing A, S and R -->
  <rect x="110" y="94" width="130" height="9" fill="#0A0A0A" rx="1" />

  <!-- Radiating Red Rays from the wand tip -->
  <!-- Wand tip is at approximately x=350, y=108 -->
  <g stroke="#DE3426" stroke-width="4.5" stroke-linecap="round">
    <!-- Fan of 8 radiating sparks / rays -->
    <line x1="358" y1="98" x2="368" y2="76" />
    <line x1="363" y1="102" x2="382" y2="84" />
    <line x1="367" y1="107" x2="394" y2="95" />
    <line x1="368" y1="113" x2="399" y2="109" />
    <line x1="366" y1="120" x2="395" y2="124" />
    <line x1="362" y1="126" x2="387" y2="137" />
    <line x1="357" y1="131" x2="373" y2="149" />
  </g>

  <!-- Wand / Rod (Black diagonal line with rounded cap) -->
  <line x1="250" y1="200" x2="350" y2="108" stroke="#0A0A0A" stroke-width="8" stroke-linecap="round" />

  <!-- Bottom Text: ONG AMSHARTE (Bold Black Sans-Serif) -->
  <text x="20" y="196" font-family="'Arial Black', 'Montserrat', 'Inter', sans-serif" font-size="29" font-weight="900" fill="#0A0A0A" letter-spacing="1">ONG AMSHARTE</text>
</svg>
